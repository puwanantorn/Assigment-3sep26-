<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKEA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- Left: Hero -->
    <section class="hero">
      <h1 class="logo">IKEA<span class="reg">&reg;</span></h1>

      <div class="hero-bottom">
        <p class="hero-text">Go shopping on your local site</p>
        <span class="hero-arrow">&darr;</span>
        <a href="#" class="site-btn">
          <span class="site-btn-label">Go to</span>
          <span class="site-btn-country">Ikea.us</span>
        </a>
      </div>
    </section>

    <!-- Right: Thumbnails -->
    <aside class="side">
      <a href="#" class="tile">
        <span class="tile-label">IKEA Today</span>
      </a>
      <a href="#" class="tile">
        <span class="tile-label">About IKEA</span>
      </a>
      <a href="#" class="tile">
        <span class="tile-label">IKEA Museum</span>
      </a>
      <a href="#" class="tile">
        <span class="tile-label">IKEA at H22</span>
      </a>
    </aside>

  </div>

</body>
</html>
